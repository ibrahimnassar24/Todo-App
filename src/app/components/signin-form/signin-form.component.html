<mat-card>
    <mat-card-header>
        <mat-card-title>Log In</mat-card-title>
        <mat-card-subtitle>if you have an account, please enter your email and password</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="signInFormState">
            <div>
                <mat-form-field appearance="outline">
                    <mat-label>
                        email
                    </mat-label>
                    <input matInput type="text" formControlName="email">
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>
                        password
                    </mat-label>
                    <input matInput type="password" formControlName="password">
                </mat-form-field>
            </div>
            <div>
                <button mat-flat-button (click)="onSignIn($event)">Log in</button>
            </div>
        </form>
    </mat-card-content>
    <mat-divider></mat-divider>
    <div>
        <button mat-stroked-button (click)="signInUsingGoogle()">Sign in with Google</button>
    </div>
    <div>
        <button mat-stroked-button (click)="signInUsingFacebook()">Sign in with Facebook</button>
    </div>
</mat-card>
