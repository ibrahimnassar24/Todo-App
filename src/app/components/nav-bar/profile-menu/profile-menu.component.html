<mat-menu #profileMenu>
    <ng-template matMenuContent>
        <mat-card>
            <mat-card-header>
                <mat-card-title *ngIf="displayName$ | async as displayName">{{ displayName }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <ng-container *ngIf="photoUrl$ | async as photoUrl">
                    <div class="profile-picture">
                        <img [src]="photoUrl" alt="User Photo" />
                    </div>
                </ng-container>
            </mat-card-content>
            <mat-card-actions>
                <a routerLink="/settings" mat-stroked-button>setting</a>
                <button mat-stroked-button (click)="signOut()">sign out</button>
            </mat-card-actions>
        </mat-card>
    </ng-template>
</mat-menu>

@if ( isLogged$ | async) {
<button mat-button [mat-menu-trigger-for]="profileMenu">
    <div class="flex-wrapper">
        <div class="profile-icon">
            <ng-container *ngIf="photoUrl$ | async as photoUrl">
                <img [src]="photoUrl" alt="User Photo" />
            </ng-container>
        </div>
        <div>
            {{ displayName$ | async }}
        </div>
    </div>
</button>
}
@else {
<a mat-button routerLink="/log">Sign in</a>
}
